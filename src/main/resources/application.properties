spring.application.name=library-management
server.port=8080

# ===== DATABASE (MySQL) =====
# Có thể ghi đè bằng biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===== JPA =====
# Bảng do Flyway tạo, Hibernate chỉ kiểm tra khớp schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== THYMELEAF =====
spring.thymeleaf.cache=false

# ===== Trang lỗi =====
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
