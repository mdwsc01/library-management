<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- ===== <head> dùng chung ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Thư viện mini'">Thư viện mini</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>



<!-- ===== Thanh điều hướng ===== -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/books}"><i class="bi bi-book-half"></i> Thư viện mini</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'books'} ? 'active'" th:href="@{/books}">
                        <i class="bi bi-journal-bookmark"></i> Sách</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'categories'} ? 'active'" th:href="@{/categories}">
                        <i class="bi bi-tags"></i> Thể loại</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'borrows'} ? 'active'" th:href="@{/borrows}">
                        <i class="bi bi-arrow-left-right"></i> Mượn / Trả</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== Thông báo sau mỗi thao tác (flash attribute) ===== -->
<div th:fragment="flash">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}">OK</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}">Lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ===== Phân trang dùng chung, giữ nguyên các tham số tìm kiếm ===== -->
<nav th:fragment="pagination(pageData)" th:if="${pageData.totalPages > 1}" aria-label="Phân trang">
    <ul class="pagination justify-content-center mb-0">
        <li class="page-item" th:classappend="${pageData.first} ? 'disabled'">
            <a class="page-link" th:href="${@urls.page(pageData.number - 1)}">&laquo;</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}"
            th:classappend="${i == pageData.number} ? 'active'">
            <a class="page-link" th:href="${@urls.page(i)}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${pageData.last} ? 'disabled'">
            <a class="page-link" th:href="${@urls.page(pageData.number + 1)}">&raquo;</a>
        </li>
    </ul>
</nav>

<!-- ===== Script cuối trang ===== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
