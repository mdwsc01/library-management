<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Không tìm thấy trang')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container text-center py-5">
    <div class="error-code text-primary">404</div>
    <h1 class="h3 mt-3">Ôi, không tìm thấy trang này</h1>
    <p class="text-muted"
       th:text="${message != null and !#strings.isEmpty(message) and message != 'No message available'} ? ${message} : 'Trang bạn tìm có thể đã bị xoá hoặc đường dẫn không đúng.'">
        Trang bạn tìm có thể đã bị xoá hoặc đường dẫn không đúng.
    </p>
    <div class="d-flex justify-content-center gap-2 mt-4">
        <a class="btn btn-primary" th:href="@{/books}"><i class="bi bi-house"></i> Về trang sách</a>
        <a class="btn btn-outline-secondary" href="javascript:history.back()"><i class="bi bi-arrow-left"></i> Quay lại</a>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
